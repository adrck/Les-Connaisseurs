<section id="results">

    <div class="results-header">
        <h2>Klassement</h2>
        <div class="season-select-group">
            <label for="season-select">Seizoen:</label>
            <select id="season-select">
                <option value="current">Huidig</option>
            </select>
        </div>
    </div>

    <div id="current-season-view">

        <label for="stage-select">Klassement na etappe:</label>
        <select id="stage-select"></select>

        <table>
            <thead>
                <tr>
                    <th>Plaats</th>
                    <th>Team</th>
                    <th>Punten</th>
                    <th>+/- vs vorige etappe</th>
                </tr>
            </thead>

            <tbody id="leaderboard-body">
            </tbody>
        </table>

    </div>

    <div id="archived-season-view" style="display:none;">

        <table>
            <thead>
                <tr>
                    <th>Plaats</th>
                    <th>Team</th>
                    <th>Punten</th>
                </tr>
            </thead>

            <tbody id="archived-leaderboard-body">
            </tbody>
        </table>

    </div>

</section>

<div class="card scoring-card" id="stage-breakdown-card">
    <h2>Detail van deze etappe</h2>
    <div id="stage-breakdown-content">
    </div>
</div>
